<app-page-header title="Usuarios registrados">
  <a mat-flat-button color="primary" routerLink="/register">Registrar usuario</a>
</app-page-header>

@if (!users().length) {
  <p class="empty">No hay usuarios registrados</p>
}

<table mat-table [dataSource]="users()" class="mat-elevation-z1 full-width">
  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef>Usuario</th>
    <td mat-cell *matCellDef="let row">{{ row.username }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
