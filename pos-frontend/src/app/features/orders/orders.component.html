<app-page-header title="Órdenes" subtitle="Historial de ventas" />

<table mat-table [dataSource]="orders()" class="mat-elevation-z1 full-width">
  <ng-container matColumnDef="orderNumber">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let row">{{ row.orderNumber }}</td>
  </ng-container>
  <ng-container matColumnDef="customerName">
    <th mat-header-cell *matHeaderCellDef>Cliente</th>
    <td mat-cell *matCellDef="let row">{{ row.customerName }}</td>
  </ng-container>
  <ng-container matColumnDef="orderType">
    <th mat-header-cell *matHeaderCellDef>Tipo</th>
    <td mat-cell *matCellDef="let row">{{ typeLabel(row.orderType) }}</td>
  </ng-container>
  <ng-container matColumnDef="totalAmount">
    <th mat-header-cell *matHeaderCellDef>Total</th>
    <td mat-cell *matCellDef="let row">S/ {{ row.totalAmount | number:'1.2-2' }}</td>
  </ng-container>
  <ng-container matColumnDef="creationDate">
    <th mat-header-cell *matHeaderCellDef>Fecha</th>
    <td mat-cell *matCellDef="let row">{{ row.creationDate | date:'short' }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let row">
      <button mat-icon-button (click)="view(row)" aria-label="Ver orden"><mat-icon>visibility</mat-icon></button>
      <button mat-icon-button (click)="exportReceipt(row)" aria-label="Exportar boleta PDF">
        <mat-icon>picture_as_pdf</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="delete(row)" aria-label="Eliminar orden"><mat-icon>delete</mat-icon></button>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
