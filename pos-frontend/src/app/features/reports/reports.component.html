<app-page-header title="Reportes" subtitle="Ventas por fecha" />

<div class="toolbar">
  <mat-form-field appearance="outline">
    <mat-label>Fecha</mat-label>
    <input matInput type="date" [formControl]="dateControl" />
  </mat-form-field>
  <button mat-flat-button color="primary" (click)="load()">Consultar</button>
</div>

<mat-card class="total-card">
  <mat-card-content>
    <h2>Total del día: S/ {{ total() | number:'1.2-2' }}</h2>
  </mat-card-content>
</mat-card>

<table mat-table [dataSource]="orders()" class="mat-elevation-z1 full-width">
  <ng-container matColumnDef="orderNumber">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let row">{{ row.orderNumber }}</td>
  </ng-container>
  <ng-container matColumnDef="customerName">
    <th mat-header-cell *matHeaderCellDef>Cliente</th>
    <td mat-cell *matCellDef="let row">{{ row.customerName }}</td>
  </ng-container>
  <ng-container matColumnDef="orderType">
    <th mat-header-cell *matHeaderCellDef>Tipo</th>
    <td mat-cell *matCellDef="let row">{{ typeLabel(row.orderType) }}</td>
  </ng-container>
  <ng-container matColumnDef="totalAmount">
    <th mat-header-cell *matHeaderCellDef>Total</th>
    <td mat-cell *matCellDef="let row">S/ {{ row.totalAmount | number:'1.2-2' }}</td>
  </ng-container>
  <ng-container matColumnDef="creationDate">
    <th mat-header-cell *matHeaderCellDef>Fecha</th>
    <td mat-cell *matCellDef="let row">{{ row.creationDate | date:'short' }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
