<app-page-header title="Clientes">
  <button mat-flat-button color="primary" (click)="openForm()">Nuevo cliente</button>
</app-page-header>

<div class="filters">
  <mat-form-field appearance="outline" class="filter">
    <mat-label>Buscar por nombre</mat-label>
    <input matInput [formControl]="nameSearch" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="filter">
    <mat-label>Buscar por documento</mat-label>
    <input matInput [formControl]="docSearch" />
  </mat-form-field>
  <button mat-stroked-button (click)="searchByDocument()">Buscar doc.</button>
</div>

<table mat-table [dataSource]="clients()" class="mat-elevation-z1 full-width">
  <ng-container matColumnDef="nombreCompleto">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let row">{{ row.nombreCompleto }}</td>
  </ng-container>
  <ng-container matColumnDef="tipoDocumento">
    <th mat-header-cell *matHeaderCellDef>Tipo</th>
    <td mat-cell *matCellDef="let row">{{ row.tipoDocumento }}</td>
  </ng-container>
  <ng-container matColumnDef="numeroDocumento">
    <th mat-header-cell *matHeaderCellDef>Documento</th>
    <td mat-cell *matCellDef="let row">{{ row.numeroDocumento }}</td>
  </ng-container>
  <ng-container matColumnDef="correo">
    <th mat-header-cell *matHeaderCellDef>Correo</th>
    <td mat-cell *matCellDef="let row">{{ row.correo || '—' }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
