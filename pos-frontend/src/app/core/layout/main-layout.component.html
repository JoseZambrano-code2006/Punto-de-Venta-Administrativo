<mat-sidenav-container class="layout-container">
  <mat-sidenav [mode]="sidenavOpened() ? 'side' : 'over'" [opened]="sidenavOpened()" class="sidenav">
    <div class="brand">POS QSR</div>
    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="active">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <span>POS Restaurante</span>
      <span class="spacer"></span>
      <span class="user">{{ username }}</span>
      <button mat-icon-button (click)="logout()" aria-label="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    @if (!hasOpenCashBox()) {
      <div class="cashbox-banner">
        No hay caja abierta. Abre una caja antes de registrar ventas.
        <a routerLink="/cash-box">Ir a Caja</a>
      </div>
    }

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
