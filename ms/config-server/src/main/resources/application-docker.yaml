spring:
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/dhamsilver/pos-service.git}
          default-label: main
          clone-on-start: true
          username: ${CONFIG_GIT_USERNAME}
          password: ${CONFIG_GIT_PASSWORD}
          search-paths: 'Config'

eureka:
  client:
    service-url:
      defaultZone: http://registry-server:8761/eureka/
  instance:
    prefer-ip-address: true
