spring:
  application:
    name: auth-server

  profiles:
    active: default

  datasource:
    url: jdbc:postgresql://localhost:5433/pos_inventory
    username: servicepos
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

application:
  jwt:
    secret: 12345678901234567890123456789012

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG

server:
  servlet:
    context-path: /auth-server
  port: 3030

eureka:
  instance:
    instance-id: "${spring.application.name}:${random.value}"

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/