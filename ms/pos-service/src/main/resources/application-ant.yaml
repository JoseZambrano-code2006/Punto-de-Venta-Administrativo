spring:
  datasource:
    hikari:
      connection-timeout: '20000'
      maximum-pool-size: '5'
    password: admin123
    username: servicepos
    url: jdbc:postgresql://localhost:5433/pos_inventory
  application:
    name: pos-venta-service
  jpa:
    show-sql: 'true'
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: 'true'

logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
        SQL: DEBUG

server:
  servlet:
    context-path: /pos-venta-service
  port: '8082' # Puerto estatico 8082, puerto dinamico = 0

eureka:
  instance:
    instance-id: "${spring.application.name}:${random.value}"
  client:
    server-url:
      defaultZone: http://localhost:8761/eureka/